<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chunk-Flow 100 (v4)</title>
  <style>
    :root {
      --bg: #121212; --card: #1e1e1e; --primary: #4f46e5;
      --accent: #22c55e; --text: #f3f4f6; --text-sub: #9ca3af;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 16px; background: var(--bg); color: var(--text);
      font-family: -apple-system, sans-serif;
      display: flex; flex-direction: column; min-height: 100vh;
    }
    .nav-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .nav-btn {
      background: #2a2a2a; color: var(--text); border: none;
      padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer;
    }
    .nav-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; }
    
    .card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    
    /* 청크 블록 강조 */
    .chunk-block-container { text-align: center; margin: 20px 0; }
    .chunk-block {
      display: inline-block; background: #2a2a2a; border: 2px solid #38bdf8; border-radius: 12px;
      padding: 16px 24px; font-size: 1.6rem; font-weight: 700; color: #38bdf8;
      cursor: pointer; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
    }
    .chunk-block.hidden { color: transparent; background: #333; border-color: #3f3f46; box-shadow: none; }
    .translation { text-align: center; color: var(--text-sub); font-size: 1.1rem; margin-top: 16px; line-height: 1.5; }
    
    /* YouGlish 연결 버튼 */
    .btn-youglish {
      width: 100%; background: #eab308; color: #000; border: none;
      border-radius: 12px; padding: 16px 0; font-size: 1.2rem; font-weight: 700;
      cursor: pointer; margin-bottom: 24px; display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    
    .progress-bar-bg { background: #2a2a2a; height: 12px; border-radius: 6px; overflow: hidden; margin: 8px 0; }
    .progress-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.2s ease; }
    
    .btn-counter {
      width: 100%; background: var(--primary); color: #fff; border: none;
      border-radius: 16px; padding: 24px 0; font-size: 1.5rem; font-weight: 700;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4); margin-top: auto; margin-bottom: 16px;
    }
    .btn-counter:active { transform: scale(0.98); opacity: 0.9; }
  </style>
</head>
<body>

  <div class="nav-bar">
    <button class="nav-btn" onclick="prevChunk()">◀ 이전</button>
    <div class="nav-title" id="dayTitle">Day 1</div>
    <button class="nav-btn" onclick="nextChunk()">다음 ▶</button>
  </div>

  <div class="card">
    <div style="font-size: 0.9rem; color: var(--text-sub); text-align: center;">오늘의 핵심 청크 (터치하여 가리기)</div>
    
    <div class="chunk-block-container">
      <div class="chunk-block" id="chunkText" onclick="this.classList.toggle('hidden')"></div>
    </div>
    
    <div class="translation" id="transArea"></div>
  </div>

  <!-- YouGlish 외부 링크 버튼 -->
  <button class="btn-youglish" onclick="openYouGlish()">
    ▶ YouGlish 원어민 발음 듣기
  </button>

  <div class="card">
    <div style="display: flex; justify-content: space-between; font-size: 0.95rem;">
      <span>숙달 게이지</span>
      <span id="counterText" style="font-weight: 600;">0 / 100회</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-fill" id="progressBar"></div>
    </div>
  </div>

  <button class="btn-counter" onclick="addCount()">
    <span id="btnLabel">발화 완료 (터치)</span>
    <span style="font-size: 0.9rem; color: #c7d2fe;">소리 내어 말할 때마다 기록하세요</span>
  </button>

  <script>
    const chunkDB = [
      { id: 1, query: "I just wanna", trans: "나 그냥 ~하고 싶어" },
      { id: 2, query: "I'm looking forward to", trans: "나 ~가 무척 기대돼" },
      { id: 3, query: "I was wondering if", trans: "혹시 ~할 수 있을까 해서요" },
      { id: 4, query: "I'm supposed to", trans: "나 ~하기로 되어 있어 / ~해야 해" },
      { id: 5, query: "Let me know if", trans: "만약 ~하면 나한테 알려줘" }
    ];

    let currentIndex = 0;

    function loadContentToUI() {
      const data = chunkDB[currentIndex];
      document.getElementById('dayTitle').innerText = `Day ${data.id}`;
      document.getElementById('chunkText').innerText = data.query;
      document.getElementById('chunkText').classList.remove('hidden');
      document.getElementById('transArea').innerHTML = data.trans;
      updateCounterUI();
    }

    // YouGlish 사이트를 새 탭으로 열어주는 함수
    function openYouGlish() {
      const query = encodeURIComponent(chunkDB[currentIndex].query);
      const url = `https://youglish.com/pronounce/${query}/english/us`;
      window.open(url, '_blank');
    }

    function addCount() {
      const data = chunkDB[currentIndex];
      let currentCount = parseInt(localStorage.getItem(`chunk_count_day_${data.id}`) || '0');
      
      if (currentCount < 100) {
        currentCount++;
        localStorage.setItem(`chunk_count_day_${data.id}`, currentCount);
        updateCounterUI(currentCount);
      }
    }

    function updateCounterUI(count) {
      const data = chunkDB[currentIndex];
      if (count === undefined) count = parseInt(localStorage.getItem(`chunk_count_day_${data.id}`) || '0');
      
      document.getElementById('counterText').innerText = `${count} / 100회`;
      document.getElementById('progressBar').style.width = `${count}%`;
      
      const btnLabel = document.getElementById('btnLabel');
      if (count >= 100) btnLabel.innerText = "🎉 100회 마스터 완료!";
      else btnLabel.innerText = `발화 완료 (터치) - ${count}회`;
    }

    function prevChunk() {
      if (currentIndex > 0) { currentIndex--; loadContentToUI(); }
      else alert("첫 번째 문장입니다.");
    }
    
    function nextChunk() {
      if (currentIndex < chunkDB.length - 1) { currentIndex++; loadContentToUI(); }
      else alert("마지막 문장입니다.");
    }

    // 초기 로딩
    window.onload = function() {
      loadContentToUI();
    };
  </script>
</body>
</html>
