<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chunk-Flow 100 (v3)</title>
  <style>
    :root {
      --bg: #121212; --card: #1e1e1e; --primary: #4f46e5;
      --accent: #22c55e; --text: #f3f4f6; --text-sub: #9ca3af;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 16px; background: var(--bg); color: var(--text);
      font-family: -apple-system, sans-serif;
      display: flex; flex-direction: column; min-height: 100vh;
    }
    
    /* 상단 네비게이션바 */
    .nav-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .nav-btn {
      background: #2a2a2a; color: var(--text); border: none;
      padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer;
    }
    .nav-btn:active { background: #3f3f46; }
    .nav-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; }
    
    /* 비디오 영역 (YouGlish) */
    .video-wrap {
      width: 100%; min-height: 220px; border-radius: 12px; overflow: hidden;
      background: #000; margin-bottom: 16px;
    }
    
    /* 조작 버튼 (다른 원어민 보기) */
    .action-row {
      display: flex; gap: 8px; margin-bottom: 16px;
    }
    .btn-secondary {
      flex: 1; background: #3f3f46; color: white; border: none;
      padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer;
    }
    
    /* 학습 카드 */
    .card { background: var(--card); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
    .chunk-block {
      display: inline-block; background: #2a2a2a; border: 1px solid #3f3f46; border-radius: 8px;
      padding: 10px 14px; font-size: 1.2rem; font-weight: 600; color: #38bdf8;
      cursor: pointer; margin-top: 8px;
    }
    .chunk-block.hidden { color: transparent; background: #333; }
    .translation { color: var(--text-sub); font-size: 1rem; margin-top: 10px; line-height: 1.5; }
    
    /* 프로그레스바 */
    .progress-bar-bg { background: #2a2a2a; height: 12px; border-radius: 6px; overflow: hidden; margin: 8px 0; }
    .progress-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.2s ease; }
    
    /* 대형 카운터 버튼 */
    .btn-counter {
      width: 100%; background: var(--primary); color: #fff; border: none;
      border-radius: 16px; padding: 20px 0; font-size: 1.3rem; font-weight: 700;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4); margin-top: auto; margin-bottom: 16px;
    }
    .btn-counter:active { transform: scale(0.98); opacity: 0.9; }
  </style>
</head>
<body>

  <div class="nav-bar">
    <button class="nav-btn" onclick="prevChunk()">◀ 이전</button>
    <div class="nav-title" id="dayTitle">Day 1</div>
    <button class="nav-btn" onclick="nextChunk()">다음 ▶</button>
  </div>

  <!-- YouGlish 위젯 영역 -->
  <div class="video-wrap">
    <div id="yg-widget-0"></div>
  </div>

  <div class="action-row">
    <button class="btn-secondary" onclick="nextVideo()">🔄 다른 원어민 영상 넘기기</button>
  </div>

  <div class="card">
    <div style="font-size: 0.8rem; color: var(--text-sub);">핵심 소리 블록 (터치하여 가리기)</div>
    <div class="chunk-block" id="chunkText" onclick="this.classList.toggle('hidden')"></div>
    <div class="translation" id="transArea"></div>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; font-size: 0.9rem;">
      <span>숙달 게이지 (자동 저장)</span>
      <span id="counterText">0 / 100회</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-fill" id="progressBar"></div>
    </div>
  </div>

  <button class="btn-counter" onclick="addCountAndReplay()">
    <span id="btnLabel">발화 완료 (터치 시 자동 리플레이)</span>
    <span style="font-size: 0.85rem; color: #c7d2fe;">한 번 말하고 누르면 영상을 다시 틀어줍니다</span>
  </button>

  <!-- YouGlish API 스크립트 -->
  <script async src="https://youglish.com/public/emb/widget.js" charset="utf-8"></script>
  <script>
    // ==========================================
    // 영어 청크 1,000개 데이터베이스 (우선 5개 샘플 탑재)
    // ==========================================
    const chunkDB = [
      { id: 1, query: "I just wanna", trans: "나 그냥 ~하고 싶어<br>(뒤에 다양한 동사가 오는 것을 영상에서 확인하세요)" },
      { id: 2, query: "I'm looking forward to", trans: "나 ~가 무척 기대돼 / 고대하고 있어" },
      { id: 3, query: "I was wondering if", trans: "혹시 ~할 수 있을까 해서요 (조심스러운 부탁)" },
      { id: 4, query: "I'm supposed to", trans: "나 (원래) ~하기로 되어 있어 / ~해야 해" },
      { id: 5, query: "Let me know if", trans: "만약 ~하면 나한테 알려줘" }
    ];

    let currentIndex = 0;
    let widget;

    // YouGlish 위젯 초기화
    function onYouglishAPIReady() {
      widget = new YG.Widget("yg-widget-0", {
        width: "100%",
        bkgColor: "theme_dark",
        events: {
          'onFetchDone': onFetchDone
        }
      });
      loadContentToUI();
    }

    // 영상 검색이 완료되었을 때
    function onFetchDone(event) {
      if (event.totalResult === 0) {
        alert("해당 청크의 영상이 없습니다.");
      }
    }

    // 화면 업데이트
    function loadContentToUI() {
      const data = chunkDB[currentIndex];
      
      // YouGlish에 해당 청크 검색 명령 내리기
      if (widget) {
        widget.fetch(data.query, "english", "us"); // 미국 영어 기준
      }

      document.getElementById('dayTitle').innerText = `Day ${data.id}`;
      document.getElementById('chunkText').innerText = data.query;
      document.getElementById('chunkText').classList.remove('hidden');
      document.getElementById('transArea').innerHTML = data.trans;

      updateCounterUI();
    }

    // 다른 원어민 영상으로 넘기기
    function nextVideo() {
      if (widget) widget.next();
    }

    // 카운트 증가 & 현재 영상 구간 자동 재시작
    function addCountAndReplay() {
      const data = chunkDB[currentIndex];
      let currentCount = parseInt(localStorage.getItem(`chunk_count_day_${data.id}`) || '0');
      
      if (currentCount < 100) {
        currentCount++;
        localStorage.setItem(`chunk_count_day_${data.id}`, currentCount);
        updateCounterUI(currentCount);
      }
      // 사용자가 탭하면 바로 그 원어민의 문장을 다시 틀어줌 (반복 섀도잉)
      if (widget) widget.replay();
    }

    function updateCounterUI(count) {
      const data = chunkDB[currentIndex];
      if (count === undefined) count = parseInt(localStorage.getItem(`chunk_count_day_${data.id}`) || '0');
      
      document.getElementById('counterText').innerText = `${count} / 100회`;
      document.getElementById('progressBar').style.width = `${count}%`;
      
      const btnLabel = document.getElementById('btnLabel');
      if (count >= 100) btnLabel.innerText = "🎉 100회 마스터 완료!";
      else btnLabel.innerText = `발화 완료 (터치 시 자동 리플레이) - ${count}회`;
    }

    // 네비게이션
    function prevChunk() {
      if (currentIndex > 0) { currentIndex--; loadContentToUI(); }
      else { alert("첫 번째 문장입니다."); }
    }
    function nextChunk() {
      if (currentIndex < chunkDB.length - 1) { currentIndex++; loadContentToUI(); }
      else { alert("마지막 문장입니다. 새로운 청크를 업데이트 해주세요!"); }
    }
  </script>
</body>
</html>
