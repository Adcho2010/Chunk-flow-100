<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chunk-Flow 100 (v2)</title>
  <style>
    :root {
      --bg: #121212; --card: #1e1e1e; --primary: #4f46e5;
      --accent: #22c55e; --text: #f3f4f6; --text-sub: #9ca3af;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 16px; background: var(--bg); color: var(--text);
      font-family: -apple-system, sans-serif;
      display: flex; flex-direction: column; min-height: 100vh;
    }
    /* 상단 네비게이션바 */
    .nav-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .nav-btn {
      background: #2a2a2a; color: var(--text); border: none;
      padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer;
    }
    .nav-btn:active { background: #3f3f46; }
    .nav-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; }
    
    /* 비디오 플레이어 */
    .video-wrap {
      position: relative; width: 100%; padding-top: 56.25%;
      border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 16px;
    }
    .video-wrap iframe {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
    }
    
    /* 학습 카드 */
    .card { background: var(--card); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
    .chunk-container { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .chunk-block {
      background: #2a2a2a; border: 1px solid #3f3f46; border-radius: 8px;
      padding: 10px 14px; font-size: 1.15rem; font-weight: 600;
      color: #38bdf8; cursor: pointer; transition: all 0.2s;
    }
    .chunk-block.hidden { color: transparent; background: #333; }
    .translation { color: var(--text-sub); font-size: 0.95rem; margin-top: 6px; line-height: 1.4; }
    
    /* 프로그레스바 */
    .progress-bar-bg { background: #2a2a2a; height: 12px; border-radius: 6px; overflow: hidden; margin: 8px 0; }
    .progress-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.2s ease; }
    
    /* 대형 카운터 버튼 */
    .btn-counter {
      width: 100%; background: var(--primary); color: #fff; border: none;
      border-radius: 16px; padding: 24px 0; font-size: 1.5rem; font-weight: 700;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4); margin-top: auto;
    }
    .btn-counter:active { transform: scale(0.98); opacity: 0.9; }
    .counter-sub { font-size: 0.85rem; font-weight: 400; color: #c7d2fe; }
  </style>
</head>
<body>

  <!-- 네비게이션: 이전/다음 -->
  <div class="nav-bar">
    <button class="nav-btn" onclick="prevChunk()">◀ 이전</button>
    <div class="nav-title" id="dayTitle">Day 1</div>
    <button class="nav-btn" onclick="nextChunk()">다음 ▶</button>
  </div>

  <!-- 비디오 영역 -->
  <div class="video-wrap">
    <div id="player"></div>
  </div>

  <!-- 청크 및 해석 영역 -->
  <div class="card">
    <div style="font-size: 0.8rem; color: var(--text-sub);">TODAY's CHUNK</div>
    <div class="chunk-container" id="chunkArea">
      <!-- 자바스크립트로 자동 생성됨 -->
    </div>
    <div class="translation" id="transArea"></div>
  </div>

  <!-- 진척도 영역 -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; font-size: 0.9rem;">
      <span>숙달 게이지 (자동 저장됨)</span>
      <span id="counterText">0 / 100회</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-fill" id="progressBar"></div>
    </div>
  </div>

  <button class="btn-counter" onclick="addCount()">
    <span id="btnLabel">1회 발화 완료 탭</span>
    <span class="counter-sub">소리 내어 말할 때마다 터치하세요</span>
  </button>

  <script>
    // ==========================================
    // 1. 영어 문장 데이터베이스 (여기에 1000개까지 계속 추가 가능!)
    // ==========================================
    const chunkDB = [
      {
        id: 1, // Day 1
        videoId: 'V6oQqPW-n4Y', // 유튜브 영상 고유 주소
        start: 533, end: 540,   // 시작/끝 초
        chunks: ["I just wanna", "eat it"],
        trans: "나 그냥 / 그거 먹고 싶어",
        sound: "아이 저스 워너 / 이릿"
      },
      {
        id: 2, // Day 2
        videoId: 'V6oQqPW-n4Y',
        start: 830, end: 835, 
        chunks: ["I don't wanna", "see"],
        trans: "나 원하지 않아 / 보는 것을 (보고 싶지 않아)",
        sound: "아이 돈 워너 / 씨"
      },
      {
        id: 3, // Day 3
        videoId: '8EXl3AnOINc', 
        start: 310, end: 316,
        chunks: ["I have been", "in business", "for a while"],
        trans: "나는 있어왔어 / 이 업계(사업)에 / 꽤 오랫동안",
        sound: "아이 해브 빈 / 인 비즈니스 / 포 어 와일"
      }
    ];

    let currentIndex = 0; // 현재 학습 중인 인덱스
    let player;

    // 유튜브 API 로드
    let tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    let firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      const data = chunkDB[currentIndex];
      player = new YT.Player('player', {
        videoId: data.videoId,
        playerVars: { 'playsinline': 1, 'controls': 1, 'rel': 0, 'start': data.start, 'end': data.end },
        events: { 'onStateChange': onPlayerStateChange, 'onReady': onPlayerReady }
      });
    }

    function onPlayerReady(event) {
      loadContentToUI();
    }

    // 영상 종료 시 무한 루프
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        player.seekTo(chunkDB[currentIndex].start);
        player.playVideo();
      }
    }

    // ==========================================
    // 2. 화면 내용 업데이트 (문장 교체)
    // ==========================================
    function loadContentToUI() {
      const data = chunkDB[currentIndex];
      
      // 영상 교체
      if (player && player.loadVideoById) {
        player.loadVideoById({ videoId: data.videoId, startSeconds: data.start, endSeconds: data.end });
      }

      // 상단 타이틀
      document.getElementById('dayTitle').innerText = `Day ${data.id}`;

      // 청크 블록 생성
      const chunkArea = document.getElementById('chunkArea');
      chunkArea.innerHTML = '';
      data.chunks.forEach(text => {
        const div = document.createElement('div');
        div.className = 'chunk-block';
        div.innerText = text;
        div.onclick = function() { this.classList.toggle('hidden'); };
        chunkArea.appendChild(div);
      });

      // 번역 텍스트
      document.getElementById('transArea').innerHTML = `${data.trans} <br><small style="color:#6b7280;">(${data.sound})</small>`;

      updateCounterUI();
    }

    // ==========================================
    // 3. 네비게이션 (이전 / 다음)
    // ==========================================
    function prevChunk() {
      if (currentIndex > 0) { currentIndex--; loadContentToUI(); }
      else { alert("첫 번째 문장입니다."); }
    }

    function nextChunk() {
      if (currentIndex < chunkDB.length - 1) { currentIndex++; loadContentToUI(); }
      else { alert("마지막 문장입니다. 새로운 문장을 업데이트 해주세요!"); }
    }

    // ==========================================
    // 4. 진척도 자동 저장 (기기 저장소 활용)
    // ==========================================
    function getCountForCurrent() {
      const data = chunkDB[currentIndex];
      return parseInt(localStorage.getItem(`chunk_count_day_${data.id}`) || '0');
    }

    function addCount() {
      const data = chunkDB[currentIndex];
      let currentCount = getCountForCurrent();
      
      if (currentCount < 100) {
        currentCount++;
        localStorage.setItem(`chunk_count_day_${data.id}`, currentCount);
        updateCounterUI(currentCount);
      }
    }

    function updateCounterUI(count) {
      if (count === undefined) count = getCountForCurrent();
      
      document.getElementById('counterText').innerText = `${count} / 100회`;
      document.getElementById('progressBar').style.width = `${count}%`;
      
      const btnLabel = document.getElementById('btnLabel');
      if (count >= 100) btnLabel.innerText = "🎉 100회 마스터 완료!";
      else btnLabel.innerText = `말하고 탭 (${count}회)`;
    }
  </script>
</body>
</html>
